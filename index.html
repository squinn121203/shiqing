                    ctx.fillText(bt.emoji, bx + 20, by + btnH / 2);

                    ctx.textAlign = 'left';
                    ctx.fillStyle = '#1a3a32';
                    ctx.font = 'bold 11px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif';
                    ctx.fillText(bt.name, bx + 36, by + btnH / 2 - 6);
                    ctx.fillStyle = '#6a8a7a';
                    ctx.font = '9px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif';
                    ctx.fillText(bt.desc, bx + 36, by + btnH / 2 + 8);
                    ctx.restore();
                }

                // ===== 开始答题按钮 =====
                const startBtnY = bulletY + 20 + 2 * (btnH + 6) + 12;
                const startBtnW = 220, startBtnH = 48;
                const startBtnX = (W - startBtnW) / 2;
                ctx.save();
                const btnGrad = ctx.createLinearGradient(startBtnX, startBtnY, startBtnX, startBtnY + startBtnH);
                btnGrad.addColorStop(0, '#5ecbb0');
                btnGrad.addColorStop(1, '#3a7a6a');
                ctx.fillStyle = btnGrad;
                ctx.shadowColor = 'rgba(58,122,106,0.3)';
                ctx.shadowBlur = 8;
                roundRect(ctx, startBtnX, startBtnY, startBtnW, startBtnH, 24);
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#faf7f2';
                ctx.font = 'bold 18px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif';
                ctx.fillText('开 始 答 题', W / 2, startBtnY + startBtnH / 2 + 1);
                ctx.restore();

                // 底部提示
                ctx.save();
                ctx.textAlign = 'center';
                ctx.fillStyle = '#8aaea0';
                ctx.font = '11px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif';
                ctx.fillText('← → / A D 选皮肤    ↑ ↓ / W S 选子弹    Enter / 点击开始', W / 2, startBtnY + startBtnH + 22);
                ctx.restore();
            }

            function drawGameOver() {
                const title = defeatReason === 'base' ? '考试挂科' : '考试挂科';
                drawOverlay(title, `卷面得分：${score}`);
                ctx.save();
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#e05555';
                ctx.font = 'bold 64px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif';
                ctx.shadowColor = 'rgba(224,85,85,0.3)';
                ctx.shadowBlur = 12;
                ctx.fillText('D', W / 2, H / 2 + 30);
                ctx.shadowBlur = 0;
                ctx.restore();
                drawRestartButton();
            }

            function drawVictory() {
                drawOverlay('金榜题名', '恭喜考上理想大学');
                ctx.save();
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#5ecbb0';
                ctx.font = 'bold 64px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif';
                ctx.shadowColor = 'rgba(94,203,176,0.3)';
                ctx.shadowBlur = 12;
                ctx.fillText('S', W / 2, H / 2 + 30);
                ctx.shadowBlur = 0;
                ctx.restore();
                drawRestartButton();
            }

            // 绘制重新开始按钮（弹窗共用）
            function drawRestartButton() {
                const btnX = W / 2 - 80, btnY = H / 2 + 65, btnW = 160, btnH = 42;
                const hover = mouseX >= btnX && mouseX <= btnX + btnW && mouseY >= btnY && mouseY <= btnY + btnH;

                ctx.save();
                ctx.shadowColor = hover ? 'rgba(94,203,176,0.5)' : 'rgba(94,203,176,0.2)';
                ctx.shadowBlur = hover ? 12 : 6;
                const btnGrad = ctx.createLinearGradient(btnX, btnY, btnX, btnY + btnH);
                btnGrad.addColorStop(0, hover ? '#5ecbb0' : '#6a8a7a');
                btnGrad.addColorStop(1, '#3a7a6a');
                ctx.fillStyle = btnGrad;
                roundRect(ctx, btnX, btnY, btnW, btnH, 8);
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif';
                ctx.fillText('重新选择', W / 2, btnY + btnH / 2 + 1);
                ctx.restore();
            }

            // ==================== 主循环 ====================
            let lastTimestamp = 0;

            function gameLoop(timestamp) {
                const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.06);
                lastTimestamp = timestamp;
                gameTime += dt;

                // 更新逻辑
                if (gameState === STATE.PLAYING) {
                    updatePlayer(dt);
                    updateEnemies(dt);
                    updateBullets(dt);
                    updateParticles(dt);
                    updatePowerUps(dt);

                    // 检查胜利条件
                    const aliveEnemies = enemies.filter(e => e.alive);
                    if (aliveEnemies.length === 0) {
                        gameState = STATE.VICTORY;
                        victoryTimer = 0;
                        spawnExplosion(W / 2, H / 2, 60, [COLORS.playerBody, COLORS.playerTurret, COLORS.explosion1,
                            COLORS.explosion2, COLORS.explosion3
                        ]);
                        screenShake = 0.3;
                        screenFlash = 0.3;
                    }

                    // 屏幕震动衰减
                    if (screenShake > 0) screenShake -= dt;
                    if (screenFlash > 0) screenFlash -= dt;
                } else if (gameState === STATE.MENU) {
                    // 菜单封面光点粒子
                    menuParticleTimer -= dt;
                    if (menuParticleTimer <= 0) {
                        menuParticleTimer = 0.25;
                        spawnMenuParticle();
                    }
                    updateParticles(dt);
                    if (keys['enter']) {
                        keys['enter'] = false;
                        particles = [];
                        // 进入皮肤/子弹选择界面
                        gameState = STATE.SKIN_SELECT;
                        skinSelectTimer = 0;
                    }
                } else if (gameState === STATE.SKIN_SELECT) {
                    skinSelectTimer += dt;
                    // 方向键选择皮肤/子弹
                    if (keys['arrowleft']) { keys['arrowleft'] = false; selectedSkinIndex = (selectedSkinIndex - 1 + SKINS.length) % SKINS.length; }
                    if (keys['arrowright']) { keys['arrowright'] = false; selectedSkinIndex = (selectedSkinIndex + 1) % SKINS.length; }
                    if (keys['a']) { keys['a'] = false; selectedSkinIndex = (selectedSkinIndex - 1 + SKINS.length) % SKINS.length; }
                    if (keys['d']) { keys['d'] = false; selectedSkinIndex = (selectedSkinIndex + 1) % SKINS.length; }
                    if (keys['w']) { keys['w'] = false; selectedBulletIndex = (selectedBulletIndex - 1 + BULLET_TYPES.length) % BULLET_TYPES.length; }
                    if (keys['s']) { keys['s'] = false; selectedBulletIndex = (selectedBulletIndex + 1) % BULLET_TYPES.length; }
                    if (keys['arrowup']) { keys['arrowup'] = false; selectedBulletIndex = (selectedBulletIndex - 1 + BULLET_TYPES.length) % BULLET_TYPES.length; }
                    if (keys['arrowdown']) { keys['arrowdown'] = false; selectedBulletIndex = (selectedBulletIndex + 1) % BULLET_TYPES.length; }
                    if (keys['enter']) {
                        keys['enter'] = false;
                        startGame();
                    }
                } else if (gameState === STATE.GAME_OVER || gameState === STATE.VICTORY) {
                    updateParticles(dt);
                    if (screenShake > 0) screenShake -= dt;
                    if (screenFlash > 0) screenFlash -= dt;
                    if (keys['enter']) {
                        keys['enter'] = false;
                        // 回到皮肤选择界面
                        gameState = STATE.SKIN_SELECT;
                        skinSelectTimer = 0;
                    }
                }

                // 绘制
                ctx.save();
                if (screenShake > 0) {
                    const shakeX = (Math.random() - 0.5) * screenShake * 16;
                    const shakeY = (Math.random() - 0.5) * screenShake * 16;
                    ctx.translate(shakeX, shakeY);
                }

                drawBackground();
                drawObstacles();
                drawBase();

                // 敌方坦克
                for (const enemy of enemies) {
                    drawTank(enemy, false);
                    if (enemy.alive) {
                        // 绘制敌方坦克类型标签
                        ctx.save();
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'bottom';
                        ctx.fillStyle = 'rgba(58,122,106,0.5)';
                        ctx.font = '10px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif';
                        ctx.fillText(enemy.label.name, enemy.x + enemy.w / 2, enemy.y - 4);
                        ctx.restore();
                    }
                }

                // 玩家buff状态光环
                if (player.alive && (player.multiShot || player.speedMultiplier !== 1.0)) {
                    ctx.save();
                    const cx = player.x + player.w / 2;
                    const cy = player.y + player.h / 2;
                    const glowColor = player.multiShot ? 'rgba(94,203,176,0.5)'
                        : player.speedMultiplier > 1.0 ? 'rgba(255,204,136,0.5)'
                        : 'rgba(136,136,204,0.5)';
                    ctx.strokeStyle = glowColor;
                    ctx.lineWidth = 2.5;
                    ctx.shadowColor = glowColor;
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(cx, cy, player.w / 2 + 6, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }

                // 玩家坦克
                drawTank(player, true, player.invincible > 0);

                // 玩家活跃BUFF指示器
                if (player.multiShot || player.speedMultiplier !== 1.0) {
                    ctx.save();
                    const indicatorX = player.x + player.w / 2;
                    const indicatorY = player.y - 20;
                    // 背景
                    ctx.fillStyle = 'rgba(10,26,24,0.8)';
                    ctx.strokeStyle = 'rgba(127,232,200,0.4)';
                    ctx.lineWidth = 1;
                    roundRect(ctx, indicatorX - 30, indicatorY - 8, 60, 16, 4);
                    ctx.fill();
                    ctx.stroke();
                    // 图标和文字
                    ctx.font = '10px "Segoe UI Emoji", "Apple Color Emoji", "PingFang SC", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    if (player.multiShot) {
                        ctx.fillText('📖 刷题', indicatorX, indicatorY);
                        // 计时条
                        const ratio = player.multiShotTimer / POWERUP_DURATION;
                        ctx.fillStyle = 'rgba(127,232,200,0.5)';
                        ctx.fillRect(indicatorX - 28, indicatorY + 10, 56 * ratio, 3);
                    } else if (player.speedMultiplier > 1.0) {
                        ctx.fillText('☕ 加速', indicatorX, indicatorY);
                        const ratio = player.speedTimer / POWERUP_DURATION;
                        ctx.fillStyle = 'rgba(255,204,136,0.5)';
                        ctx.fillRect(indicatorX - 28, indicatorY + 10, 56 * ratio, 3);
                    } else if (player.speedMultiplier < 1.0) {
                        ctx.fillText('😴 减速', indicatorX, indicatorY);
                        const ratio = player.speedTimer / POWERUP_DURATION;
                        ctx.fillStyle = 'rgba(136,136,204,0.5)';
                        ctx.fillRect(indicatorX - 28, indicatorY + 10, 56 * ratio, 3);
                    }
                    ctx.restore();
                }

                drawBullets();
                drawPowerUps();
                drawPickupTexts();
                drawParticles();

                ctx.restore();

                // 屏幕闪光
                if (screenFlash > 0) {
                    ctx.fillStyle = `rgba(184,255,232,${screenFlash * 2.5})`;
                    ctx.fillRect(0, 0, W, H);
                }

                // HUD
                if (gameState === STATE.PLAYING || gameState === STATE.GAME_OVER || gameState === STATE.VICTORY) {
                    updateHUD();
                }

                // 覆盖层
                if (gameState === STATE.MENU) {
                    drawMenu();
                } else if (gameState === STATE.SKIN_SELECT) {
                    drawSkinSelect();
                } else if (gameState === STATE.GAME_OVER) {
                    drawGameOver();
                } else if (gameState === STATE.VICTORY) {
                    drawVictory();
                }

                requestAnimationFrame(gameLoop);
            }

            // ==================== 辅助绘制函数 ====================
            function roundRect(ctx, x, y, w, h, r) {
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.lineTo(x + w - r, y);
                ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                ctx.lineTo(x + w, y + h - r);
                ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                ctx.lineTo(x + r, y + h);
                ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                ctx.lineTo(x, y + r);
                ctx.quadraticCurveTo(x, y, x + r, y);
                ctx.closePath();
            }

            // ==================== 初始化 ====================
            function init() {
                updateHUD();
                lastTimestamp = performance.now();
                requestAnimationFrame(gameLoop);
            }

            // 开始
            init();

            // 防抖处理Enter键
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                }
            });

            console.log('🌊 浪尖社区 · ZJY坦克大战已启动');
            console.log('⚙️ 皮肤选择：← → / A D    子弹选择：↑ ↓ / W S  (12种学科子弹)');
            console.log('🎮 操作：WASD/方向键移动 | 空格发射 | Enter确认');
            console.log('💡 ZJY+SQUINN=9科彩色课本 | 外围围墙=试卷纸');
        })();
    </script>
</body>
</html>
